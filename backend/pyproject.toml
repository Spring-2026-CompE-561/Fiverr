[project]
name = "giglink-backend"
version = "0.1.0"
description = "GigLink Marketplace backend (FastAPI)"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
  "fastapi[standard]>=0.115.0,<1",
  "uvicorn[standard]>=0.30.0,<1",
  "sqlalchemy>=2.0.0,<3",
  "pydantic-settings>=2.0.0,<3",
  "python-dotenv>=1.0.0,<2",
  "passlib[bcrypt]>=1.7.4,<2",
  "bcrypt>=4.0.1,<4.1",
  "python-jose[cryptography]>=3.3.0,<4",
  "requests>=2.32.0,<3",
  "email-validator>=2.0.0,<3",
  "psycopg[binary]>=3.1.0,<4",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0,<1",
  "pytest>=9.0.0,<10",
  "pytest-cov>=7.0.0,<8",
  "ruff>=0.15.0",
  "black>=24.0.0",
  "isort>=5.12.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1,<1",
  "pytest>=9.0.2,<10",
  "pytest-cov>=7.1.0,<8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
fix = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "E501",
    "D107",
    "D104",
    "D",
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
