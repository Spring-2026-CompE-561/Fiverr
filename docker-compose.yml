services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: giglink
      POSTGRES_PASSWORD: giglink
      POSTGRES_DB: giglink
    volumes:
      - giglink_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U giglink -d giglink"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    image: giglink-backend:latest
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://giglink:giglink@postgres:5432/giglink
      JWT_SECRET: ${JWT_SECRET:-docker-dev-secret-change-me}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      FRONTEND_URL: http://localhost:3000

      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_USER: jasperhuang04@gmail.com
      SMTP_PASSWORD: "euxt oiaa uzsl kfxf"
      EMAIL_FROM: jasperhuang04@gmail.com
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    image: giglink-backend:latest
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg://giglink:giglink@postgres:5432/giglink
    command: ["python", "scripts/seed_marketplace.py"]
    restart: "no"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  giglink_pgdata:
